[package]
name = "bil-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for BIL SDK"

[features]
default = []
aissurance-local = ["dep:bil-aissurance-bridge"]

[dependencies]
bil-core = { path = "../bil-core" }
bil-canonical = { path = "../bil-canonical" }
bil-mir = { path = "../bil-mir" }
bil-sdk = { path = "../bil-sdk" }
bil-ink = { path = "../bil-ink" }
bil-verify = { path = "../bil-verify" }
bil-conformance = { path = "../bil-conformance" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4.6.1", features = ["derive"] }
bil-aissurance-bridge = { path = "../../integrations/bil-aissurance-bridge", optional = true }

[dev-dependencies]
tempfile = "3.12"
