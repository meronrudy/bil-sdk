[workspace]
members = [
    "crates/bil-core",
    "crates/bil-canonical",
    "crates/bil-mir",
    "crates/bil-ink",
    "crates/bil-signers",
    "crates/bil-verify",
    "crates/bil-conformance",
    "crates/bil-sdk",
    "crates/bil-cli"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["BIL SDK Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/meronrudy/bil"
readme = "README.md"
description = "Base Institutional Language (BIL) SDK"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
sha2 = "0.10"
