[package]
name = "cios-sim"
version = "0.1.0"
edition = "2021"
description = "Deterministic data generators for CIOS simulation"
authors = ["CIOS Team"]
license = "MIT OR Apache-2.0"

[dependencies]
engine = { workspace = true }
ctw-machine = { workspace = true }
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
approx = "0.5"