[package]
name = "actuarial"
version = "0.1.0"
edition = "2021"

[dependencies]
contracts = { path = "../contracts" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
statrs = "0.16"
ndarray = { version = "0.15", features = ["serde"] }
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = "1.0"
rand = "0.8"
rand_pcg = "0.3"
