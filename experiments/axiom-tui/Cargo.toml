[workspace]

[package]
name = "axiom"
version = "0.9.2"
edition = "2021"
description = "AXIOM - AI Assurance Actuarial Engine TUI"

[[bin]]
name = "axiom"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
ratatui = "0.27"
crossterm = { version = "0.27", features = ["event-stream"] }
chrono = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
